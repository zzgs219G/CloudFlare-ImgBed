# Cloudflare Workers 部署配置
# 使用方式: npx wrangler deploy --config deploy/worker/wrangler.toml
#
# 部署前需要配置以下 binding：
# 1. D1 数据库 - 取消注释并填入你的 database_id
# 2. R2 存储桶 - 取消注释并填入你的 bucket_name
# 3. KV 命名空间 - 如果使用 KV 而非 D1，取消注释并填入 id
# 4. 环境变量 - 在 [vars] 中配置
#
# GitHub Actions 部署时会自动从 Secrets/Variables 生成此文件，
# 无需手动编辑。详见 .github/workflows/deploy-worker.yml

name = "cloudflare-imgbed"
main = "index.js"
compatibility_date = "2026-07-27"
# 让 Worker 对自身 zone 的 fetch() 走公网入口，不要直连 origin。
compatibility_flags = ["global_fetch_strictly_public"]

# 静态资源（前端文件）
[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

#[vars]
#TG_BOT_TOKEN = "8300201762:AAHMtyu1IzC6f3iqFJyx1mjUb4jWfss2P7Q"
#TG_CHAT_ID = "-1003527961949

[[d1_databases]]
binding = "img_d1"
database_name = "img_d1"
database_id = "b01a74ca-2c28-4834-b03e-f2a2776929ed"

[[r2_buckets]]
binding = "img_r2"
bucket_name = "imgbed"

